<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoast - Soporte Técnico</title>
    
    <style>
        /* CONFIGURACIÓN DEL FONDO Y DE LA LETRA */
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf8f5; /* Fondo beige claro */
            color: #3e2723; /* Texto marrón oscuro */
            padding: 20px;
        }

        /* CAJA BLANCA QUE ENCUADRA TODO EL FORMULARIO */
        .caja-formulario {
            background-color: white;
            border: 1px solid #d7ccc8; /* Un borde simple en vez de sombras raras */
            max-width: 500px;
            margin: 30px auto; /* Centra la caja en la pantalla */
            padding: 20px;
        }

        /* BOTÓN PARA VOLVER ATRÁS  */
        .boton-volver {
            background-color: #757575; /* Gris intermedio */
            color: white;
            border: none;
            padding: 8px 15px;
            text-decoration: none; /* Le quita la línea azul de los enlaces */
            font-size: 14px;
            display: inline-block; /* Hace que se comporte como un bloque rígido */
            cursor: pointer;
            margin-bottom: 15px; /* Deja espacio con lo que sigue abajo */
        }

        /* TÍTULOS DEL FORMULARIO */
        .titulo {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #5d4037;
        }

        .campo {
            margin-bottom: 15px; /* Deja espacio entre pregunta y pregunta */
        }

        .campo label {
            display: block; /* Fuerza a que el texto se quede arriba */
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* LAS CAJAS DE TEXTO Y SELECTORES */
        .campo input, 
        .campo select, 
        .campo textarea {
            width: 100%; /* Ocupan todo el ancho disponible */
            padding: 8px;
            border: 1px solid #cccccc; /* Borde gris clásico */
            box-sizing: border-box; /* Evita que se deformen */
            font-family: Arial, sans-serif;
        }

        /* BOTÓN DE ENVIAR  */
        .boton-enviar {
            background-color: #380e0e; /* Rojo apagado simple */
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Contenedor simple -->
    <main class="caja-formulario">
        
        <!-- BOTÓN DE VOLVER AGREGADO -->
        <a href="bienvenida.html" class="boton-volver">Volver al Inicio</a>
        
        <h1 class="titulo">Soporte Técnico</h1>
        <p class="subtitulo">Llená los datos para que revisemos tu máquina rápido.</p>

        <form>
            <!-- Nombre del Tostadero -->
            <div class="campo">
                <label>Nombre del Tostadero o Cafetería:</label>
                <input type="text" placeholder="Ej: Cafetería Carlitos" required>
            </div>

            <!-- Correo de contacto -->
            <div class="campo">
                <label>Correo Electrónico:</label>
                <input type="email" placeholder="Carlitos@correo.com" required>
            </div>

            <!-- Selección de la máquina -->
            <div class="campo">
                <label>¿Qué máquina falla?:</label>
                <select required>
                    <option value="">-- Selecciona una opción --</option>
                    <option value="tostadora">Tostadora de Café</option>
                    <option value="molino">Molino de Café</option>
                    <option value="otro">Otro equipo</option>
                </select>
            </div>

            <!-- Nivel de urgencia -->
            <div class="campo">
                <label>¿Qué tan urgente es?:</label>
                <select required>
                    <option value="baja">Baja (Mantenimiento)</option>
                    <option value="media">Media (Falla un poco)</option>
                    <option value="alta">Crítica (Producción parada)</option>
                </select>
            </div>

            <!-- Detalle del problema -->
            <div class="campo">
                <label>Contanos qué le pasa a la máquina:</label>
                <textarea rows="4" placeholder="Ej: No calienta el tambor..." required></textarea>
            </div>

            <!-- Botón para mandar -->
            <div class="campo">
                <button type="submit" class="boton-enviar">Enviar Reporte</button>
            </div>
        </form>
        
    </main>
    
</body>
</html>
